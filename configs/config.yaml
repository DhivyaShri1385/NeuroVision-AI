# ============================================================
# NeuroVision AI — Master Configuration
# All paths are resolved from env vars at runtime.
# Do NOT hardcode absolute paths here.
# ============================================================

project:
  name: "NeuroVision AI"
  version: "1.0.0"
  description: "Explainable Brain Tumor Diagnosis & Segmentation Platform"

# ----- Class Definitions -----
classes:
  names:
    - glioma
    - meningioma
    - no_tumor
    - pituitary
  num_classes: 4
  # Alphabetically sorted matches tf.keras flow_from_directory label encoding
  label_map:
    glioma: 0
    meningioma: 1
    no_tumor: 2
    pituitary: 3

# ----- Preprocessing -----
preprocessing:
  image_size: [224, 224]      # EfficientNetB0/B3 input resolution
  channels: 3                  # RGB — convert grayscale MRIs automatically
  # ImageNet statistics — used for EfficientNet transfer learning
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  clip_percentile: [1, 99]     # Clip pixel outliers before normalization

# ----- Data Augmentation -----
# Applied ONLY to training split. Never to val/test.
augmentation:
  enabled: true
  horizontal_flip: true
  vertical_flip: false          # Anatomically invalid for brain MRI
  rotation_limit: 15            # Degrees — keep clinically plausible
  shift_limit: 0.05
  scale_limit: 0.10
  brightness_limit: 0.20
  contrast_limit: 0.20
  blur_limit: 3
  gaussian_noise_variance: [10.0, 50.0]
  elastic_transform: true
  elastic_alpha: 120
  elastic_sigma: 6
  grid_distortion: false        # Too aggressive for diagnostic imaging
  augmentation_probability: 0.5 # Each transform applied with this probability

# ----- Dataset Split -----
# Used when creating a fresh split from raw data.
# If the dataset is already pre-split, this section is used for validation.
split:
  train_ratio: 0.70
  val_ratio:   0.15
  test_ratio:  0.15
  random_seed: 42
  stratified: true

# ----- Training Hyperparameters (Phase 2) -----
training:
  batch_size: 32
  epochs: 80
  initial_learning_rate: 1.0e-3
  fine_tune_learning_rate: 1.0e-5
  warmup_epochs: 5
  early_stopping_patience: 12
  reduce_lr_patience: 6
  reduce_lr_factor: 0.5
  min_lr: 1.0e-7
  label_smoothing: 0.1
  dropout_rate: 0.40
  l2_regularization: 1.0e-4
  mixed_precision: true        # Use float16 for faster training on GPU

# ----- Model Selection (Phase 2) -----
model:
  backbone: "EfficientNetB3"   # Primary backbone
  pretrained_weights: "imagenet"
  freeze_base_epochs: 10       # Train only head for this many epochs first
  pooling: "avg"
  ensemble:
    - "EfficientNetB3"
    - "ResNet50"
    - "DenseNet121"

# ----- Segmentation (Phase 3) -----
segmentation:
  architecture: "AttentionUNet"
  input_size: [256, 256, 1]    # Grayscale for segmentation
  filters: [64, 128, 256, 512]
  dropout: 0.30
  batch_norm: true

# ----- XAI (Phase 4) -----
xai:
  gradcam_layer: "top_conv"    # Last conv layer of EfficientNet
  overlay_alpha: 0.45
  colormap: "jet"

# ----- Logging -----
logging:
  level: "INFO"
  rotation: "50 MB"
  retention: "30 days"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} | {message}"

# ----- tf.data Pipeline -----
pipeline:
  prefetch_buffer: -1          # AUTOTUNE
  shuffle_buffer: 1000
  cache_in_memory: false       # Set true only if dataset fits in RAM
  num_parallel_calls: -1       # AUTOTUNE
